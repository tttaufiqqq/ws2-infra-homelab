name: Bump image tag

# Receives repository_dispatch from Animal-Shelter-Workshop's deploy.yml after
# it builds and pushes new asw-app / asw-nginx images. Bumps the tag in k8s/
# and pushes to main; ArgoCD (webhook on this repo) syncs the change.
#
# The `[skip ci]` in the commit message stops this push from re-triggering
# other push-based workflows here.
on:
  repository_dispatch:
    types: [asw-image-built]

concurrency:
  group: bump-image-tag
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate SHA
        env:
          SHA: ${{ github.event.client_payload.sha }}
        run: |
          # Payload comes from another repo; never interpolate it unchecked.
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "bad sha: $SHA"; exit 1; }

      - name: Bump tags in k8s manifests
        env:
          SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          sed -i "s|image: docker.io/tttaufiqqq/animal-shelter-workshop:.*|image: docker.io/tttaufiqqq/animal-shelter-workshop:${SHA}|" k8s/deployment.yaml
          sed -i "s|image: docker.io/tttaufiqqq/animal-shelter-workshop-nginx:.*|image: docker.io/tttaufiqqq/animal-shelter-workshop-nginx:${SHA}|" k8s/nginx-deployment.yaml

      - name: Commit and push
        env:
          SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          git diff --quiet k8s/ && { echo "tags already current"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml k8s/nginx-deployment.yaml
          git commit -m "chore(k8s): bump asw-app/asw-nginx image tags to ${SHA} [skip ci]"
          git push origin HEAD:main
